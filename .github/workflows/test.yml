name: Thank You GIF
on:
  pull_request:
    types: [opened]

jobs:
  comment:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Post GIF Comment
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIPHY_KEY: ${{ secrets.GIPHY_API_KEY }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          GIF_URL=$(curl -s "https://api.giphy.com/v1/gifs/random?api_key=$GIPHY_KEY&tag=thank%20you&rating=g" | jq -r '.data.images.downsized.url')
          
          curl -s -X POST \
            -H "Authorization: token $TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            -d "{\"body\": \"### 🎉 Thank you for PR #$PR_NUMBER!\\n![Thank You]($GIF_URL)\"}" \
            "https://api.github.com/repos/$REPO/issues/$PR_NUMBER/comments"
