on:
  pull_request:
    types:
      - opened

jobs:
  testing-action:
    runs-on: ubuntu-latest
    permissions:
      contents: read      # Added this for checkout
      issues: write
      pull-requests: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}  # ← This fixes it
          fetch-depth: 0

      - name: Post PR Comment
        uses: ./
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          giphy-api-key: ${{ secrets.GIPHY_API_KEY }}
 
